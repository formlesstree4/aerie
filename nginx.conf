server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Long-lived caching for hashed asset files produced by Vite.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Single-page app: unknown routes fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip            on;
    gzip_types      text/css application/javascript application/json image/svg+xml application/wasm;
    gzip_min_length 1024;
}
