# Plain HTTP. Still useful: WebGPU works over http://localhost, so browsing from
# the Docker host itself needs no certificate at all. Remote origins get the
# secure-context error, hence the HTTPS listener below.
server {
    listen       80;
    listen       [::]:80;
    server_name  _;

    include /etc/nginx/snippets/aerie-app.conf;
}

# HTTPS. navigator.gpu is only exposed in a secure context, so any access that
# isn't localhost has to come through here. The certificate is generated on
# first start by /docker-entrypoint.d/40-aerie-cert.sh.
server {
    listen       443 ssl;
    listen       [::]:443 ssl;
    http2        on;
    server_name  _;

    ssl_certificate     /etc/nginx/certs/aerie.crt;
    ssl_certificate_key /etc/nginx/certs/aerie.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;

    include /etc/nginx/snippets/aerie-app.conf;
}
