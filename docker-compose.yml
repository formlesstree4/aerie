services:
  aerie:
    build:
      context: .
      dockerfile: Dockerfile
    image: aerie:latest
    container_name: aerie
    ports:
      - "8080:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
